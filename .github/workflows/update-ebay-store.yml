name: Update eBay store data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-store-items:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Refresh store item JSON
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_DEV_ID: ${{ secrets.EBAY_DEV_ID }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          EBAY_SELLER_USERNAME: ${{ secrets.EBAY_SELLER_USERNAME }}
          EBAY_STORE_NAME: ${{ vars.EBAY_STORE_NAME }}
          EBAY_MAX_TRUSTED_LISTINGS: ${{ vars.EBAY_MAX_TRUSTED_LISTINGS }}
        run: node .github/scripts/update-ebay-store-data.js

      - name: Commit updated store data
        run: |
          if git diff --quiet -- data/store-items.json; then
            echo "No store data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/store-items.json
          git commit -m "Update eBay store data"
          git push
