# Deploy static site to GitHub Pages
name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inject My Mission password hash
        env:
          MY_MISSION_PASSWORD_HASH: ${{ secrets.MY_MISSION_PASSWORD_HASH }}
        run: |
          if [ -z "$MY_MISSION_PASSWORD_HASH" ]; then
            echo "::error::MY_MISSION_PASSWORD_HASH secret is not set."
            exit 1
          fi

          node -e "const fs = require('fs'); const file = 'src/scripts/my-mission.js'; const placeholder = '__MY_MISSION_PASSWORD_HASH__'; const hash = process.env.MY_MISSION_PASSWORD_HASH.trim(); const source = fs.readFileSync(file, 'utf8'); if (!source.includes(placeholder)) { console.error('Password hash placeholder was not found.'); process.exit(1); } fs.writeFileSync(file, source.replaceAll(placeholder, hash));"

      - name: Build TypeScript and SCSS
        run: npm run build

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          DEPLOY_DIR="$(mktemp -d)"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            ./ "$DEPLOY_DIR"/

          cd "$DEPLOY_DIR"
          touch .nojekyll
          git init
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy static site"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
