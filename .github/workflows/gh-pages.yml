# Deploy static site to GitHub Pages
name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Refresh eBay store data
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          EBAY_USER_ACCESS_TOKEN: ${{ secrets.EBAY_USER_ACCESS_TOKEN }}
          EBAY_SELLER_USERNAME: ${{ secrets.EBAY_SELLER_USERNAME }}
          EBAY_STORE_NAME: ${{ vars.EBAY_STORE_NAME }}
          EBAY_SEARCH_KEYWORDS: ${{ vars.EBAY_SEARCH_KEYWORDS }}
          EBAY_MAX_TRUSTED_LISTINGS: ${{ vars.EBAY_MAX_TRUSTED_LISTINGS }}
        run: node .github/scripts/update-ebay-store-data.js

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript and SCSS
        run: npm run build

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          DEPLOY_DIR="$(mktemp -d)"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            ./ "$DEPLOY_DIR"/

          cd "$DEPLOY_DIR"
          touch .nojekyll
          git init
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy static site"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
