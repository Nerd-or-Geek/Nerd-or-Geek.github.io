<body class="mission-login-body">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TLCF99CZ"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div class="mission-login-page">
        <a href="index.html" class="mission-login-logo-link">
            <img src="assets/img/Logo-With-Name.png" alt="Nerd or Geek" class="mission-login-logo">
        </a>

        <div class="mission-password-card mission-login-card">
            <i class="fas fa-lock" aria-hidden="true"></i>
            <h1>This page is password protected.</h1>
            <p>Please enter the password to continue.</p>
            <form id="missionLoginForm" class="mission-password-form">
                <label for="missionPasswordInput" class="sr-only">Password</label>
                <div class="mission-password-input-row">
                    <input type="password" id="missionPasswordInput" placeholder="Password" autocomplete="current-password" required>
                    <button type="submit">Unlock</button>
                </div>
                <p class="mission-password-message" id="missionPasswordMessage" role="status" aria-live="polite"></p>
            </form>
        </div>

        <a href="index.html" class="mission-login-back"><i class="fas fa-arrow-left"></i> Back to home</a>
    </div>

    <script src="src/scripts/mission-login.js" type="module"></script>
